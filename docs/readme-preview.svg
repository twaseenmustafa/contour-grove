   <path d="M0 -12 C-16 -45 -37 -73 -30 -114 C-23 -154 19 -156 30 -117 C40 -79 14 -42 0 -12Z"/>
   <path d="M0 -12 C-16 -45 -37 -73 -30 -114 C-23 -154 19 -156 30 -117 C40 -79 14 -42 0 -12Z" transform="rotate(72)"/>
   <path d="M0 -12 C-16 -45 -37 -73 -30 -114 C-23 -154 19 -156 30 -117 C40 -79 14 -42 0 -12Z" transform="rotate(144)"/>
   <path d="M0 -12 C-16 -45 -37 -73 -30 -114 C-23 -154 19 -156 30 -117 C40 -79 14 -42 0 -12Z" transform="rotate(216)"/>
   <path d="M0 -12 C-16 -45 -37 -73 -30 -114 C-23 -154 19 -156 30 -117 C40 -79 14 -42 0 -12Z" transform="rotate(288)"/>
   <circle r="25" fill="#4b1929" stroke="#edc7bd"/>
  </g>
 </g>
 <!-- selection overlay -->
 <rect x="150" y="45" width="91" height="144" fill="none" stroke="#e5aeb6" stroke-width="1" opacity=".78"/>
 <g fill="#fff5ed" stroke="#d994a3" stroke-width="1.4"><circle cx="150" cy="45" r="4"/><circle cx="241" cy="45" r="4"/><circle cx="150" cy="189" r="4"/><circle cx="241" cy="189" r="4"/></g>
</g>
