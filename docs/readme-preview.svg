 <path d="M7 12 L13 127 Q14 133 19 128 L42 102 L56 138 Q58 143 63 141 L77 135 Q81 133 79 128 L65 94 L98 93 Q105 93 100 87 L16 8 Q7 0 7 12Z" fill="#835261"/>
 <path d="M0 0 L5 115 Q5 120 10 115 L33 89 L48 125 Q50 130 55 128 L69 122 Q73 120 71 115 L57 81 L90 80 Q97 80 92 74 L8 -5 Q0 -12 0 0Z" fill="url(#cursor)" stroke="#fff9f0" stroke-width="1.4" stroke-linejoin="round"/>
 <path d="M7 3 L12 91" fill="none" stroke="#fff" stroke-width="1.8" opacity=".42"/>
</g>
<path d="M1094 123c1.2 10 5.4 14.3 15 15.5-9.6 1.2-13.8 5.5-15 15.5-1.2-10-5.4-14.3-15-15.5 9.6-1.2 13.8-5.5 15-15.5Z" fill="#f1d4cc" opacity=".9"/>
